# Grafana dashboards provider for the local observability stack.
#
# This file declares ONE file-backed provider that watches
# /var/lib/grafana/dashboards (mounted from infra/grafana/dashboards/
# by docker-compose.observability.yml). Drop JSON dashboard exports
# into that directory and Grafana picks them up on the next sync
# (10s by default).
#
# P10-003 ships the v1 Polaris dashboards into infra/grafana/dashboards/:
#
#   polaris-ingestion.json    — accept/reject, reject reasons, dedupe
#   polaris-rabbitmq.json     — native broker metrics + publish-fail proxy
#   polaris-processors.json   — per-processor consumed/emitted/failed/DLQ
#   polaris-destinations.json — per-vendor delivery success/failure
#   polaris-clickhouse.json   — sink lag/INSERT failures + escape-hatch audit
#
# Plus the per-project topic-isolation dashboards from P11-008.
# See docs/operations/dashboards.md for the panel inventory and gap list.

apiVersion: 1

providers:
  - name: polaris-dashboards
    orgId: 1
    folder: Polaris
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      # Path inside the container — matches the mount in
      # docker-compose.observability.yml.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
