# Polaris local RabbitMQ overrides.
#
# Mounted at /etc/rabbitmq/conf.d/10-polaris.conf. Production settings live
# with the production deployment, not here — this file exists so a local
# developer's broker behaves like the real one on the axes that matter for
# correctness (durability, stream defaults, and the failure modes Polaris
# relies on).
#
# See docs/architecture/03-rabbitmq-streams.md and
#     docs/operations/backup-and-retention.md

## Streams -------------------------------------------------------------

# Stream sizing (retention age, max bytes, segment size) is declared per
# stream in packages/shared-transport/src/topology.ts rather than set as a
# broker default: the values differ per family (90 days for canonical
# streams, 7 for diagnostics) and a broker-wide default would silently win
# on any stream someone declared by hand.

## Memory and disk ------------------------------------------------------

# Block publishers when free disk falls below this. Streams are sized by
# `x-max-length-bytes` per partition, but a wedged consumer plus a traffic
# spike can still fill a laptop's disk; blocking beats corrupting.
disk_free_limit.absolute = 2GB

# Local development runs alongside ClickHouse and Postgres, so cap the
# broker rather than letting it take 40% of the machine.
vm_memory_high_watermark.relative = 0.4

## Defaults -------------------------------------------------------------

# Polaris declares every queue and stream explicitly (see
# packages/shared-transport/src/topology.ts). Nothing in the platform
# relies on the default queue type, but pinning it makes an accidental
# hand-declared queue a quorum queue rather than a classic one.
default_queue_type = quorum

# Consumer timeout: how long a delivery may stay unacked before the
# channel is closed. Polaris handlers are bounded by destination HTTP
# timeouts (30s) plus retries; 30 minutes is generous enough that only a
# genuinely stuck handler trips it.
consumer_timeout = 1800000
