# Polaris v1 Prometheus alert rules.
#
# Thresholds are the v1 defaults from `docs/implementation/tasks/
# P10-005-alerts-runbooks.md` (Initial alert thresholds). They start
# permissive enough to avoid alert fatigue on a fresh deployment and
# are tightened after observed traffic.
#
# Every alert carries:
#   - `severity` — `page` (wake the on-call) or `warn` (visible in
#     dashboards, opens a ticket, no page).
#   - `service` — the human-readable service surface the alert covers.
#   - `team` — `platform-data` (the Polaris on-call rotation).
#
# Annotations:
#   - `summary` — single-line headline.
#   - `description` — operator-facing one-paragraph context with the
#     metric expression.
#   - `runbook_url` — relative path into `docs/operations/`. The
#     Alertmanager template is expected to compose the absolute URL
#     from this; tests at the runbook-index level assert every URL
#     points to a real file.
#
# Metric gaps (`_TODO_:` lines below) are documented in
# `docs/operations/alerts.md` and in the P10-005 commit body. They
# will land alongside the corresponding service work:
#
#   * RabbitMQ publish failure rate    → ingester-api transport publisher
#   * ClickHouse ingestion lag         → polaris_clickhouse_sink_lag_seconds
#   * ClickHouse MV failure            → polaris-clickhouse-exporter (future)
#   * replay job stuck                 → replay coordinator (P5/P7 work)
#   * operator gate denial rate        → polaris-cli / control-plane gate
#
# See:
#   docs/operations/alerts.md
#   docs/architecture/08-observability-and-operations.md
groups:
  # ---------------------------------------------------------------
  # Ingestion
  # ---------------------------------------------------------------
  - name: polaris-ingestion
    interval: 30s
    rules:
      - alert: PolarisIngestionSchemaRejectionRate
        expr: polaris:ingest_schema_rejection_ratio:rate5m > 0.05
        for: 5m
        labels:
          severity: page
          service: ingester-api
          team: platform-data
        annotations:
          summary: "Ingestion schema rejection rate above 5% for {{ $labels.project_id }}/{{ $labels.environment }}"
          description: |
            Schema-shape rejections account for more than 5% of ingest
            batch outcomes for project {{ $labels.project_id }} in
            environment {{ $labels.environment }}, sustained for 5
            minutes. Common causes: an SDK rolled out an event whose
            envelope drifted from the registered schema, or a producer
            forgot to bump the schema version after a contract change.
          runbook_url: docs/operations/runbook-ingestion-rejection-spike.md

      - alert: PolarisIngestionForbiddenFieldRejectionRate
        expr: polaris:ingest_forbidden_field_rejection_ratio:rate5m > 0.01
        for: 5m
        labels:
          severity: page
          service: ingester-api
          team: platform-data
        annotations:
          summary: "Ingestion forbidden-field rejection rate above 1% for {{ $labels.project_id }}/{{ $labels.environment }}"
          description: |
            More than 1% of ingest batches from project
            {{ $labels.project_id }} in environment
            {{ $labels.environment }} are rejected because the policy
            guard found a forbidden field. Producers should redact at
            the SDK; a spike usually means a freshly-deployed integration
            is leaking PII or credential-shaped values into the payload.
            Do NOT widen the policy without security review.
          runbook_url: docs/operations/runbook-ingestion-rejection-spike.md

  # ---------------------------------------------------------------
  # RabbitMQ
  # ---------------------------------------------------------------
  - name: polaris-rabbitmq
    interval: 30s
    rules:
      - alert: PolarisRabbitmqPublishFailureRate
        expr: |
          sum by (project_id, environment, topic) (
            rate(polaris_ingest_publish_failed_total[1m])
          )
          /
          clamp_min(
            sum by (project_id, environment, topic) (
              rate(polaris_ingest_publish_failed_total[1m])
              + rate(polaris_ingest_publish_success_total[1m])
            ),
            1
          ) > 0.005
        for: 1m
        labels:
          severity: page
          service: ingester-api
          team: platform-data
        annotations:
          summary: "RabbitMQ publish failure rate above 0.5%"
          description: |
            More than 0.5% of ingester publish attempts to RabbitMQ
            failed over the last minute for {{ $labels.project_id }} /
            {{ $labels.environment }} on stream {{ $labels.topic }}.
            Common causes: broker unavailability, an undeclared
            exchange (publishes come back unroutable), permission
            drift on the vhost, or the broker blocking publishers on a
            disk/memory alarm. See the runbook for triage.
          runbook_url: docs/operations/runbook-rabbitmq-publish-failures.md

      # Consumer lag (warn at 5 min, page at 15 min). Polaris emits
      # `polaris_processor_lag_ms_last` per (processor_name,
      # processor_version, project_id, environment, topic_family,
      # concrete_topic, partition). 5 min = 300_000 ms; 15 min =
      # 900_000 ms.
      - alert: PolarisConsumerLagWarn
        expr: max by (processor_name, processor_version, project_id, environment, topic_family, concrete_topic, partition) (polaris_processor_lag_ms_last) > 300000
        for: 5m
        labels:
          severity: warn
          service: rabbitmq
          team: platform-data
        annotations:
          summary: "Consumer lag >5 min on {{ $labels.processor_name }} / {{ $labels.concrete_topic }} (project={{ $labels.project_id }})"
          description: |
            Processor {{ $labels.processor_name }}@{{ $labels.processor_version }}
            for project {{ $labels.project_id }} is lagging
            {{ $labels.concrete_topic }} by more than 5 minutes.
            Often a transient catch-up after a deploy or a temporary
            slow downstream; if it persists, see the runbook.
          runbook_url: docs/operations/runbook-processor-lag.md

      - alert: PolarisConsumerLagPage
        expr: max by (processor_name, processor_version, project_id, environment, topic_family, concrete_topic, partition) (polaris_processor_lag_ms_last) > 900000
        for: 5m
        labels:
          severity: page
          service: rabbitmq
          team: platform-data
        annotations:
          summary: "Consumer lag >15 min on {{ $labels.processor_name }} / {{ $labels.concrete_topic }} (project={{ $labels.project_id }})"
          description: |
            Processor {{ $labels.processor_name }}@{{ $labels.processor_version }}
            for project {{ $labels.project_id }} is lagging
            {{ $labels.concrete_topic }} by more than 15 minutes,
            sustained for 5 minutes. End-to-end latency is now
            measurably degraded. Wake the on-call.
          runbook_url: docs/operations/runbook-processor-lag.md

  # ---------------------------------------------------------------
  # Processors
  # ---------------------------------------------------------------
  - name: polaris-processors
    interval: 30s
    rules:
      - alert: PolarisIdentityMergeBreakerTripped
        expr: |
          sum by (processor_name, processor_version, environment) (
            rate(polaris_processor_events_skipped_total{
              processor_name="sync-identity-resolver", reason="merge_suspended"
            }[5m])
          ) > 0
        for: 5m
        labels:
          severity: page
          service: processor
          team: platform-data
        annotations:
          summary: "Identity merge-rate breaker tripping in {{ $labels.environment }}"
          description: |
            The identity stage is REFUSING merges: a profile has absorbed
            more merges inside its policy window than the breaker allows.
            This is the signature of a promiscuous identifier — a kiosk
            device, `customer_id: "guest"`, a shared bot id — chain-merging
            strangers into one mega-profile.

            The breaker is doing its job, so the graph has stopped growing;
            what it cannot do is undo merges already committed. Every
            minute it keeps tripping is a minute of events resolving to a
            profile that may already be wrong, which is why this pages
            rather than warns.

            Find the offending value in `identity.merge_suspended` events,
            add it to the project's `identity.denylist` in
            definitions/projects/<id>.yaml, then rebuild the affected profiles
            — merges are derived state and repair is a rebuild under
            corrected policy, not an inverse operation.
          runbook_url: docs/operations/runbook-identity-merge-storm.md

      - alert: PolarisProcessorDLQGrowthWarn
        expr: polaris:processor_dlq_growth:rate1m > 100
        for: 5m
        labels:
          severity: warn
          service: processor
          team: platform-data
        annotations:
          summary: "Processor DLQ growing >100/min on {{ $labels.processor_name }} (project={{ $labels.project_id }})"
          description: |
            Processor {{ $labels.processor_name }}@{{ $labels.processor_version }}
            for project {{ $labels.project_id }} is DLQ-ing more than
            100 events/minute. One of: a producer rolled out a
            malformed event, an upstream dependency is unhealthy, or
            a handler regression slipped. Drains to the processor DLQ
            topic; triage with `polaris dlq list --vendor ...` or the
            processor-specific surface.
          runbook_url: docs/operations/runbook-dlq-growth.md

      - alert: PolarisProcessorDLQGrowthPage
        expr: polaris:processor_dlq_growth:rate1m > 1000
        for: 5m
        labels:
          severity: page
          service: processor
          team: platform-data
        annotations:
          summary: "Processor DLQ growing >1000/min on {{ $labels.processor_name }} (project={{ $labels.project_id }})"
          description: |
            Processor {{ $labels.processor_name }}@{{ $labels.processor_version }}
            for project {{ $labels.project_id }} is DLQ-ing more than
            1000 events/minute, sustained for 5 minutes. Almost always
            a producer-side regression or a fully-broken downstream;
            wake the on-call.
          runbook_url: docs/operations/runbook-dlq-growth.md

  # ---------------------------------------------------------------
  # Destinations
  # ---------------------------------------------------------------
  - name: polaris-destinations
    interval: 30s
    rules:
      - alert: PolarisDestinationDeliveryFailureRate
        expr: polaris:destination_delivery_failure_ratio:rate5m > 0.01
        for: 5m
        labels:
          severity: page
          service: destination
          team: platform-data
        annotations:
          summary: "Destination delivery failure rate >1% for {{ $labels.vendor }} / {{ $labels.destination_id }}"
          description: |
            Destination instance {{ $labels.destination_id }} (vendor
            {{ $labels.vendor }}, consumer
            {{ $labels.consumer_version }}) is failing more than 1% of
            delivery attempts over 5 minutes for project
            {{ $labels.project_id }} in environment
            {{ $labels.environment }}. Inspect `polaris deliveries
            list <destination_id>` and the destination-DLQ runbook.
          runbook_url: docs/operations/runbook-destination-api-failure.md

      - alert: PolarisDestinationDLQGrowth
        expr: polaris:destination_dlq_growth:rate1m > 50
        for: 5m
        labels:
          severity: page
          service: destination
          team: platform-data
        annotations:
          summary: "Destination DLQ growing >50/min for {{ $labels.vendor }} / {{ $labels.destination_id }}"
          description: |
            Destination instance {{ $labels.destination_id }} (vendor
            {{ $labels.vendor }}, consumer
            {{ $labels.consumer_version }}) is DLQ-ing more than 50
            events/minute. Triage with `polaris dlq list --destination
            {{ $labels.destination_id }}` and follow the
            destination-DLQ runbook.
          runbook_url: docs/operations/runbook-dlq-growth.md

  # ---------------------------------------------------------------
  # ClickHouse
  # ---------------------------------------------------------------
  - name: polaris-clickhouse
    interval: 30s
    rules:
      # `polaris_clickhouse_sink_lag_seconds{table}` is emitted by
      # async/warehouse/clickhouse-sink: now - the envelope's `ingested_at`
      # for the last row it wrote.
      #
      # It replaces `polaris_clickhouse_kafka_ingestion_lag_seconds`,
      # which the analytics-projector derived from
      # `system.kafka_consumers`. That system table is empty now that
      # ClickHouse consumes nothing — the alert would have silently
      # stopped firing rather than failing loudly, which is the worst
      # way for a lag alert to break.
      - alert: PolarisClickHouseIngestionLagWarn
        expr: max by (table) (polaris_clickhouse_sink_lag_seconds) > 120
        for: 5m
        labels:
          severity: warn
          service: clickhouse
          team: platform-data
        annotations:
          summary: "ClickHouse ingestion lag >2 min"
          description: |
            The ClickHouse sink's ingestion lag for table
            {{ $labels.table }} has been above 2 minutes for 5 minutes.
            Triage with the runbook.
          runbook_url: docs/operations/runbook-clickhouse-ingestion-lag.md

      - alert: PolarisClickHouseIngestionLagPage
        expr: max by (table) (polaris_clickhouse_sink_lag_seconds) > 600
        for: 5m
        labels:
          severity: page
          service: clickhouse
          team: platform-data
        annotations:
          summary: "ClickHouse ingestion lag >10 min"
          description: |
            The ClickHouse sink's ingestion lag for table
            {{ $labels.table }} has been above 10 minutes for 5 minutes.
            Triage with the runbook.
          runbook_url: docs/operations/runbook-clickhouse-ingestion-lag.md

      # `polaris_clickhouse_sink_rows_skipped_total` counts messages the
      # sink could not project onto an ingestion row — an undecodable
      # body, or an envelope missing one of the six required fields. The
      # sink skips them and advances its checkpoint, which is the right
      # call (throwing would rewind the partition and re-deliver the same
      # broken message forever, stalling every healthy event behind it)
      # but it is also the only path where an event leaves the pipeline
      # without landing in ClickHouse, a DLQ, or an ingester rejection.
      #
      # A steady trickle is the signal that matters: the projector emits
      # canonical envelopes, so a non-zero rate means something upstream
      # is publishing to these streams that should not be, or a processor
      # has started emitting a malformed envelope. Alerting on the rate
      # rather than the total keeps a long-ago incident from pinning the
      # alert on forever.
      - alert: PolarisClickHouseSinkRowsSkipped
        expr: sum(rate(polaris_clickhouse_sink_rows_skipped_total[5m])) * 60 > 1
        for: 10m
        labels:
          severity: warn
          service: clickhouse
          team: platform-data
        annotations:
          summary: "ClickHouse sink is skipping messages"
          description: |
            The ClickHouse sink has been skipping more than 1 message per
            minute for 10 minutes. These events reach neither ClickHouse
            nor a DLQ. Grep the sink logs for
            `component=clickhouse-sink.decode` to see the offending
            stream and offset.
          runbook_url: docs/operations/runbook-clickhouse-ingestion-lag.md

      # Replaces PolarisClickHouseMVFailure, which read
      # `polaris_clickhouse_mv_state{state="failed"}` and could never fire.
      # That gauge was polled from `system.view_refreshes`, which tracks
      # REFRESHABLE materialized views; all nine of Polaris's are plain
      # insert-triggered views and never appear there. The alert was live
      # for months over the MV layer and had never been capable of firing.
      #
      # With `materialized_views_ignore_errors` at 0, an MV whose SELECT
      # throws fails the INSERT into its source table, and the exception
      # reaches the sink. So the failure is countable exactly where it
      # lands, and the `table` label says which MV chain broke.
      - alert: PolarisClickHouseInsertFailures
        expr: increase(polaris_clickhouse_sink_insert_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: page
          service: clickhouse
          team: platform-data
        annotations:
          summary: "ClickHouse INSERT failing from the sink"
          description: |
            INSERTs into {{ $labels.table }} are being rejected. The sink
            restores its checkpoint and re-reads, so this stalls ingestion
            rather than dropping it — expect sink lag to climb alongside.
            A materialized view reading that table throwing is one cause;
            check the sink log for the ClickHouse exception text.
          runbook_url: docs/operations/runbook-clickhouse-ingestion-lag.md

  # ---------------------------------------------------------------
  # Replay
  # ---------------------------------------------------------------
  - name: polaris-replay
    interval: 30s
    rules:
      # `polaris_replay_job_progress_offset{replay_job_id}` and
      # `polaris_replay_job_status{replay_job_id, status}` are emitted
      # by the replay executor via the
      # `ReplayExecutorMetricsSink` seam (3S3YY2PG). The alert fires
      # when a job whose status is `running` has not advanced its
      # progress offset for 30 minutes. NOTE: the executor only emits
      # in-process; the v1 CLI invocation has no `/metrics` endpoint,
      # so the alert can fire only when a long-running scraper (e.g.
      # the future replay-coordinator service, or a `replay_jobs`-row
      # poller in the control-plane API) wires the sink to its
      # registry. The metric names + alert expression are stable
      # contracts; the scraper is a separate scope.
      - alert: PolarisReplayJobStuck
        expr: |
          (max by (replay_job_id) (polaris_replay_job_status{status="running"}) > 0)
          and on (replay_job_id)
          (changes(polaris_replay_job_progress_offset[30m]) == 0)
        for: 30m
        labels:
          severity: page
          service: replay-coordinator
          team: platform-data
        annotations:
          summary: "Replay job has not advanced in 30 min"
          description: |
            Replay job {{ $labels.replay_job_id }} has been `running`
            for 30 minutes without its progress offset changing. The
            executor either deadlocked on a chunk fetch, a downstream
            broker dropped, or the store adapter is stuck.
          runbook_url: docs/operations/runbook-replay-stuck.md

  # ---------------------------------------------------------------
  # Operator gate
  # ---------------------------------------------------------------
  - name: polaris-operator
    interval: 30s
    rules:
      - alert: PolarisOperatorGateDenialRate
        expr: sum by (actor, reason) (rate(polaris_operator_gate_denied_total[1m])) * 60 > 5
        for: 5m
        labels:
          severity: warn
          service: control-plane
          team: platform-data
        annotations:
          summary: "Operator gate denial rate >5/min"
          description: |
            Operator gate denials sustained above 5/min for actor
            {{ $labels.actor }} (reason {{ $labels.reason }}).
            Suggests credential confusion or a script wielding stale
            tokens. See the runbook to investigate.
          runbook_url: docs/operations/runbook-replay-stuck.md
      - alert: PolarisDestinationBreakerOpen
        expr: max by (vendor, destination_id, environment) (polaris_destination_breaker_state) == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Destination {{ $labels.destination_id }} ({{ $labels.vendor }}) is circuit-broken"
          description: >-
            The runtime has stopped attempting deliveries to this instance after
            consecutive transient vendor failures, and is probing once per
            cooldown. Events are parked in retry tiers, not dropped, and will
            flow once the vendor recovers. Held for 5m so a brief vendor blip
            that the breaker itself absorbs does not page anyone — the breaker
            working as intended is not an incident.

      - alert: PolarisDestinationFreshnessSlo
        expr: >-
          histogram_quantile(0.99, sum by (vendor, environment, le)
            (rate(polaris_destination_freshness_seconds_bucket[10m]))) > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Destination freshness p99 for {{ $labels.vendor }} is over 15 minutes"
          description: >-
            p99 occurred_at-to-delivered has exceeded 15 minutes for 15 minutes.
            This measures staleness at the VENDOR, so it catches the case every
            duration panel misses: a vendor answering quickly while the consumer
            runs far behind. Check consumer lag and the retry tiers before
            suspecting the vendor.

      # ---- schema governance (7VO2HFNT) ------------------------------
      #
      # The quarantine's own alerts. R12 specifies these as PER-EVENT-TYPE
      # volume anomalies, because "this project's rejections doubled" is
      # the same sentence whether one event type broke or every one did,
      # and only the first is something an operator can go fix.
      #
      # That grouping was aspirational until 2026-08-19: the counter
      # carried no `event` label, so this rule grouped by
      # (project_id, environment, reason) and its own comment claimed a
      # dimension the series did not have. Prometheus does not complain
      # about `by (event)` on a metric without one — it silently returns
      # one aggregate group, which reads exactly like a real result.
      #
      # `event` is bounded to catalog-registered names; anything else
      # arrives as `<unregistered>`. A rejected event's name is
      # producer-supplied, so labelling with it directly would let an API
      # key holder mint a series per made-up name. When the label reads
      # `<unregistered>`, `polaris violations list` has the real names.
      - alert: PolarisIngestRejectionSpike
        # Fires when a (project, environment, event, reason) rejects more
        # than five times its own trailing hour. Relative, not absolute: a
        # project sending a million events a day and one sending a
        # thousand have nothing useful in common on an absolute
        # threshold, and one of the two would be permanently lit.
        expr: >-
          sum by (project_id, environment, event, reason) (rate(polaris_ingest_batch_rejected_total[10m]))
          >
          5 * sum by (project_id, environment, event, reason) (rate(polaris_ingest_batch_rejected_total[1h] offset 1h))
          and
          sum by (project_id, environment, event, reason) (rate(polaris_ingest_batch_rejected_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: ingester-api
          team: platform-data
        annotations:
          summary: "Rejections of {{ $labels.event }} for {{ $labels.project_id }} spiked ({{ $labels.reason }})"
          description: >-
            Rejections of `{{ $labels.event }}` for one reason code are more
            than five times this project's own trailing hour, sustained for 15
            minutes. The usual cause is a producer release that changed one
            event's payload shape. Run `polaris violations list --project
            {{ $labels.project_id }} --reason {{ $labels.reason }} --since
            <deploy-time>` to see exactly what changed — the quarantine keeps a
            redacted sample of each one. An `event` of `<unregistered>` means
            the names are not catalog events; the samples carry them verbatim.
            The second clause suppresses the ratio on event types rejecting a
            handful of events an hour, where five-times is noise.

      # The other half of "volume anomaly": traffic that STOPS.
      #
      # A rejection spike catches a producer that started sending the wrong
      # shape. It cannot catch the deploy that stopped sending an event
      # type at all — no rejections, no errors, no failing check anywhere,
      # and the first person to notice is whoever asks why a funnel went
      # flat a week later. Silence is not an absence of signal here; it is
      # the signal.
      - alert: PolarisIngestEventTypeStopped
        # Accepted volume for one (project, environment, event) has fallen
        # to zero while its own trailing day was meaningfully non-zero.
        # `offset 1h` so the comparison window does not include the outage
        # that is being detected.
        expr: >-
          sum by (project_id, environment, event) (rate(polaris_ingest_batch_accepted_total[30m])) == 0
          and
          sum by (project_id, environment, event) (rate(polaris_ingest_batch_accepted_total[1d] offset 1h)) > 0.05
        for: 1h
        labels:
          severity: warning
          service: ingester-api
          team: platform-data
        annotations:
          summary: "{{ $labels.project_id }} stopped sending {{ $labels.event }}"
          description: >-
            No `{{ $labels.event }}` has been accepted for
            {{ $labels.project_id }} in 30 minutes, against a trailing day
            averaging more than one every 20 seconds. Nothing is failing —
            the events are not arriving. Check for a producer deploy, an SDK
            upgrade that renamed the event, or a consent change that stopped
            the client emitting it. `polaris events trace` on a recent
            event_id of this type shows where the last one got to.
            The one-hour `for:` is deliberately long: a 30-minute gap in a
            low-traffic event type is ordinary, and paging on it would train
            the alert away.
      - alert: PolarisQuarantineDropping
        # The fail-open backstop. The publish is deliberately
        # fire-and-forget so a broker outage cannot become an ingestion
        # outage — which means this counter is the ONLY evidence that the
        # governance loop has stopped recording anything.
        expr: sum(rate(polaris_ingest_violation_dropped_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: ingester-api
          team: platform-data
        annotations:
          summary: "The schema-governance quarantine is dropping violations"
          description: >-
            The ingester cannot publish to `rejected.events`. Ingestion is
            unaffected by design — the publish is fail-open — but rejections
            are no longer reaching the quarantine, so `polaris violations
            list` and the rejection dashboards are now blind for as long as
            this lasts. Check the broker and the `rejected.events` super
            stream's declaration.

