# Polaris local Prometheus scrape config.
#
# Mounted read-only into the `prometheus` container by
# docker-compose.observability.yml. Targets reflect the local layout:
# Polaris services typically run on the host (so Prometheus reaches
# them via `host.docker.internal` from inside the compose network);
# RabbitMQ and ClickHouse run inside the compose network and are
# reachable by service name.
#
# Metric ownership:
#
#   * `polaris_ingest_*`      — apps/ingester-api/src/metrics/registry.ts
#                               surfaced over /metrics. P10-002 wires the
#                               Prometheus text-format exposition.
#   * `polaris_processor_*`   — packages/shared-processor/src/metrics.ts
#                               surfaced over the per-processor /metrics
#                               endpoint (sync-identity :4018 today).
#   * `polaris_destination_*` — reserved for P9/P10-002 consumer metrics.
#
# See:
#   docs/architecture/08-observability-and-operations.md
#   apps/ingester-api/src/metrics/registry.ts
#   packages/shared-processor/src/metrics.ts

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # `cluster` is a fixed label on every series so a future federation
  # step has a coherent identifier. Local dev uses `polaris-local`;
  # staging and production override via Prometheus instance config.
  external_labels:
    cluster: polaris-local

# Alert + recording rules from P10-005 (Alerts and Runbooks). Files
# live under `infra/prometheus/rules/`; the glob picks up future
# additions automatically. The operator-facing index of every alert is
# `docs/operations/alerts.md`.
rule_files:
  - rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------
  # Prometheus itself — useful for "is my Prometheus alive?" panels
  # and a sanity scrape target during initial bring-up.
  # ---------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          polaris_component: observability

  # ---------------------------------------------------------------
  # Ingester API — `apps/ingester-api`. Exposes /metrics with the
  # `polaris_ingest_*` counters defined in
  # apps/ingester-api/src/metrics/registry.ts.
  #
  # `host.docker.internal` resolves to the host machine from inside
  # the compose network on Docker Desktop and on Linux 26+. When
  # running the ingester INSIDE the compose network instead, replace
  # this target with `ingester-api:8080`.
  # ---------------------------------------------------------------
  - job_name: polaris-ingester
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
        labels:
          polaris_service: ingester-api
          polaris_component: ingester

          polaris_component: processor

  # ---------------------------------------------------------------
  # The spine — `sync/identity/resolver/v1` and
  # `sync/enrichment/runtime/v1`, stages 2 and 3 of the main pipeline.
  #
  # Both expose the `polaris_processor_*` families plus
  # `polaris_processor_outcome_total`, which is the one that matters for
  # these two: both stages FAIL OPEN, so a missing profile row or an
  # absent geo database produces a well-formed event and never touches
  # the failure counters. The outcome label is where a silent
  # degradation becomes visible.
  #
  # Ports match the `dev` scripts and the Dockerfiles (4014 / 4015).
  # ---------------------------------------------------------------
  - job_name: polaris-sync-identity
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4018"]
        labels:
          polaris_service: sync-identity
          polaris_processor_name: sync-identity-resolver
          polaris_processor_version: v1
          polaris_component: processor

  - job_name: polaris-sync-enrichment
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4015"]
        labels:
          polaris_service: sync-enrichment
          polaris_processor_name: sync-enrichment-runtime
          polaris_processor_version: v1
          polaris_component: processor

  # ---------------------------------------------------------------
  # Attribution engine, ALL THREE versions.
  #
  # v1 and v2 key touchpoint chains on whichever identifier an event
  # carried; v3 keys them on the person. Neither v1 nor v2 was ever
  # scraped, so the comparison the cutover rests on — do v3's chains hold
  # first-touch across a login where v2's fragmented? — had no series
  # behind it at all.
  #
  # Rows are disjoint by `processor_version` in the chain primary key, so
  # the three can run at once and be told apart in Postgres. These jobs
  # make them tellable apart in Prometheus too.
  # ---------------------------------------------------------------
  - job_name: polaris-attribution-engine-v3
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4020"]
        labels:
          polaris_service: attribution-engine
          polaris_processor_name: attribution-engine
          polaris_processor_version: v3
          polaris_component: processor

  # ---------------------------------------------------------------
  # Sessionizer, BOTH versions.
  #
  # v1 keys session windows on whichever identifier an event carried; v2
  # keys them on the person the identity stage resolved. They run side by
  # side until R2C retires v1, and the whole point of watching them
  # together is the comparison — v1's session count should fall as v2's
  # holds steady across logins.
  #
  # Two jobs rather than one because they are two processes on two ports.
  # Every series they emit already carries `processor_version`, so a
  # dashboard can also separate them without the job labels; the labels
  # are here for consistency with the jobs above.
  # ---------------------------------------------------------------
  - job_name: polaris-sessionizer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4012"]
        labels:
          polaris_service: sessionizer
          polaris_processor_name: sessionizer
          polaris_processor_version: v1
          polaris_component: processor

  - job_name: polaris-sessionizer-v2
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4017"]
        labels:
          polaris_service: sessionizer
          polaris_processor_name: sessionizer
          polaris_processor_version: v2
          polaris_component: processor

  # ---------------------------------------------------------------
  # RabbitMQ. The `rabbitmq_prometheus` plugin (enabled in
  # infra/rabbitmq/enabled_plugins) serves Prometheus metrics on
  # :15692/metrics. `polaris-rabbitmq` is the container name from
  # docker-compose.yml; the compose network resolves it.
  #
  # `/metrics` is the aggregated endpoint. Per-queue series (depth,
  # publish/deliver rates) need the detailed endpoint, which is why the
  # per-object metrics families are requested explicitly — the default
  # aggregated view would collapse every stream into one number and make
  # "which family is backing up?" unanswerable.
  #
  # See:
  #   https://www.rabbitmq.com/docs/prometheus
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # Services that emit metrics an alert reads. Absent until 2026-08-18,
  # which made nine of twenty alerts unfireable: the metric existed, the
  # service exposed it, and nothing collected it. The metric-name lint
  # checks that a NAME has a source; it cannot see that the source is
  # never scraped.
  #
  # Ports continue this file's own numbering, which is the only place
  # they are written down. `docs/development/observability.md` carries the
  # same table.
  # ---------------------------------------------------------------
  - job_name: polaris-journey-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4023"]
        labels:
          polaris_service: journey-orchestrator
          polaris_component: processor

  - job_name: polaris-archiver
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4022"]
        labels:
          polaris_service: archiver
          polaris_component: processor

  - job_name: polaris-clickhouse-sink
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5010"]
        labels:
          polaris_service: clickhouse-sink
          polaris_component: consumer

  - job_name: polaris-control-plane-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          polaris_service: control-plane-api
          polaris_component: api

  - job_name: polaris-webhook-sink
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]
        labels:
          polaris_service: webhook-sink
          polaris_vendor: webhook-sink
          polaris_component: destination

  - job_name: polaris-meta-capi
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          polaris_service: meta-capi
          polaris_vendor: meta-capi
          polaris_component: destination

  - job_name: polaris-tiktok
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5003"]
        labels:
          polaris_service: tiktok
          polaris_vendor: tiktok
          polaris_component: destination

  - job_name: polaris-ga4
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5002"]
        labels:
          polaris_service: ga4
          polaris_vendor: ga4
          polaris_component: destination

  - job_name: polaris-braze
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5004"]
        labels:
          polaris_service: braze
          polaris_vendor: braze
          polaris_component: destination

  - job_name: polaris-rabbitmq
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
        - queue_metrics
        - channel_metrics
        - connection_churn_metrics
        - node_coarse_metrics
    static_configs:
      - targets: ["polaris-rabbitmq:15692"]
        labels:
          polaris_service: rabbitmq
          polaris_component: streaming

  # ---------------------------------------------------------------
  # OpenTelemetry Collector self-metrics. The collector exposes its
  # own Prometheus endpoint on :8889 (configured in
  # infra/otel/collector.yaml). Catches collector health issues
  # before services notice them as silent metric drops.
  # ---------------------------------------------------------------
  - job_name: polaris-otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          polaris_service: otel-collector
          polaris_component: observability

  # Retroactive-merge worker (U2EV9PRG). Keeps polaris.profile_merge_map
  # current so person-keyed ClickHouse reads resolve a merged profile to its
  # survivor. Port 4021 per infra/docker/README.md — a NEW port, never a
  # predecessor's, so a rollback cannot have two versions on one target.
  - job_name: polaris-merge-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4021"]
        labels:
          polaris_service: merge-worker
          polaris_processor_name: merge-worker
          polaris_processor_version: v1
