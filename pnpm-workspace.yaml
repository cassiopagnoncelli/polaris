packages:
  - "apps/*"
  - "packages/*"
  - "sync/*/*/*"
  - "async/*/*/*"
  - "tests"

  # ADR-0007 six-kind tree. Only `definitions/*` matches anything today.
  #
  # The restructure moves roughly two dozen packages, and a move that also
  # has to edit the workspace file is a move that collides with every other
  # move in its group. So the destinations are declared first, in one card,
  # and each subsequent move is a pure `git mv` — the package resolves under
  # its new path the moment it lands, because pnpm resolves imports by
  # package NAME and the name has not changed.
  #
  # Both old and new globs are live at once, deliberately. That is what makes
  # the transition incremental rather than a single unreviewable commit: for
  # the length of programme T, `packages/shared-db` and
  # `libs/persistence/postgres` are equally valid locations. IJ4NN closes it
  # by deleting the `packages/*` entry above once nothing is left there.
  #
  # `catalog/*` needed no such transition and got none: 0DIPB moved the whole
  # directory in one card, so its five entries left with it rather than
  # waiting for IJ4NN. `definitions/*` covers what they named, and their
  # reasons are unchanged by the rename — traits, audiences, journeys and
  # reverse-ETL are packages so the CLI and the runner import one registry
  # instead of each re-reading the directory, and the forbidden-field policy
  # is one so the ingester's first pass and the destination's second pass
  # enforce an identical override set rather than each discovering files.
  #
  # A glob that matches a directory without a package.json is skipped, not an
  # error, so `libs/*` may name `libs/persistence` (a grouping directory) and
  # `definitions/*` may name `definitions/events` (declared YAML, not code)
  # without either becoming a workspace member.
  - "libs/*" # libs/spec, libs/pipeline, libs/governance
  - "libs/*/*" # libs/persistence/postgres, libs/identity/graph
  - "sdks/*" # sdks/web, sdks/node
  - "connectors/*/*/*" # connectors/destinations/braze/v1
  - "definitions/*" # definitions/{traits,policy,audiences,journeys,reverse-etl}
allowBuilds:
  # esbuild arrives transitively via tsx and vite/vitest. Its install script only
  # links the prebuilt @esbuild/<platform> binary that pnpm already fetched as an
  # optional dep — no network fetch, no codegen — so it is safe to run.
  esbuild: true
