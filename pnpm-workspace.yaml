packages:
  - "apps/*"
  - "sync/*/*/*"
  - "async/*/*/*"
  - "tests"

  # ADR-0007 six-kind tree. `connectors/*/*/*` still matches nothing, which is
  # the point: the destination is declared before P9J7X fills it, so the card
  # that creates the first connector is a pure add.
  #
  # The `packages/*` entry that sat above, and the dual-glob transition it
  # opened, are both gone. For the length of programme T both roots were live
  # at once so that each move could be a pure `git mv` — pnpm resolves imports
  # by package NAME, so a package resolved under its new path the moment it
  # landed. IJ4NN emptied `packages/`, renamed the twenty-four packages to
  # match their new paths, and closed the transition.
  #
  # A glob that matches a directory without a package.json is skipped, not an
  # error, so `libs/*` may name `libs/persistence` (a grouping directory) and
  # `definitions/*` may name `definitions/events` (declared YAML, not code)
  # without either becoming a workspace member.
  #
  # `definitions/*` covers what `catalog/*` named, and their reasons are
  # unchanged by the rename — traits, audiences, journeys and reverse-ETL are
  # packages so the CLI and the runner import one registry instead of each
  # re-reading the directory, and the forbidden-field policy is one so the
  # ingester's first pass and the destination's second pass enforce an
  # identical override set rather than each discovering files.
  - "libs/*" # libs/spec, libs/pipeline, libs/governance
  - "libs/*/*" # libs/persistence/postgres, libs/observability/logger
  - "sdks/*" # sdks/web, sdks/node
  - "connectors/*/*/*" # connectors/destinations/braze/v1
  - "definitions/*" # definitions/{traits,policy,audiences,journeys,reverse-etl}
allowBuilds:
  # esbuild arrives transitively via tsx and vite/vitest. Its install script only
  # links the prebuilt @esbuild/<platform> binary that pnpm already fetched as an
  # optional dep — no network fetch, no codegen — so it is safe to run.
  esbuild: true
