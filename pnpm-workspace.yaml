packages:
  - "apps/*"
  - "sync/*/*/*"
  - "async/*/*/*"
  - "tests"

  # ADR-0007 six-kind tree. `connectors/*/*/*` was declared here before any
  # connector existed, which is why P9J7X was a pure add: five packages landed
  # under a glob that was already waiting for them, with no edit to this file
  # and therefore no conflict with the two cards moving beside it.
  #
  # The `packages/*` entry that sat above, and the dual-glob transition it
  # opened, are both gone. For the length of programme T both roots were live
  # at once so that each move could be a pure `git mv` — pnpm resolves imports
  # by package NAME, so a package resolved under its new path the moment it
  # landed. IJ4NN emptied `packages/`, renamed the twenty-four packages to
  # match their new paths, and closed the transition.
  #
  # A glob that matches a directory without a package.json is skipped, not an
  # error, so `libs/*` may name `libs/persistence` (a grouping directory) and
  # `definitions/*` may name `definitions/events` (declared YAML, not code)
  # without either becoming a workspace member.
  #
  # `definitions/*` covers what `catalog/*` named, and their reasons are
  # unchanged by the rename — traits, audiences, journeys and reverse-ETL are
  # packages so the CLI and the runner import one registry instead of each
  # re-reading the directory, and the forbidden-field policy is one so the
  # ingester's first pass and the destination's second pass enforce an
  # identical override set rather than each discovering files.
  - "libs/*" # libs/spec, libs/pipeline, libs/governance
  - "libs/*/*" # libs/persistence/postgres, libs/observability/logger
  - "sdks/*" # sdks/web, sdks/node
  - "connectors/*/*/*" # connectors/destinations/braze/v1
  - "definitions/*" # definitions/{traits,policy,audiences,journeys,reverse-etl}
allowBuilds:
  # esbuild arrives transitively via tsx and vite/vitest. Its install script only
  # links the prebuilt @esbuild/<platform> binary that pnpm already fetched as an
  # optional dep — no network fetch, no codegen — so it is safe to run.
  esbuild: true

# Every Dockerfile assembles its runtime tree with `pnpm deploy --prod /deploy`,
# and from pnpm v10 on that refuses to run without this key:
#
#   [ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE] By default, starting from pnpm v10,
#   we only deploy from workspaces that have "inject-workspace-packages=true" set
#
# Injection is not a formality to get past that message; it is the mode these
# images need. Every Dockerfile ends with `COPY --from=builder /deploy /app`, and
# a /deploy whose `workspace:*` deps are symlinks into /workspace does not
# survive that copy — the links leave the tree they point out of, and the
# runtime stage has no /workspace to resolve them against. Injected deps are
# real files inside /deploy, so the tree is self-contained, which is the
# property a container image requires of anything it copies.
#
# `pnpm deploy --legacy` is the other way to clear the error. It keeps the
# symlinks, i.e. preserves the property that is wrong here, and pnpm documents
# it as transitional. See docs/adr/0008-inject-workspace-packages-on-deploy.md.
#
# The key is camelCase BECAUSE IT IS IN THIS FILE, and that is a trap worth
# naming: the error message above quotes the `.npmrc` spelling,
# `inject-workspace-packages`, and writing that spelling here is valid YAML that
# pnpm reads as an unknown key and ignores. `pnpm install` then succeeds, the
# lockfile records nothing, and `pnpm deploy` fails with the identical message —
# the fix looks applied and is not. `scripts/lint-docker-deploy.mjs` asserts the
# effective value via `pnpm config get`, which is the only form of this check
# that a misspelling cannot pass.
injectWorkspacePackages: true
