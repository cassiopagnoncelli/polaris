# Polaris processor manifest — identity-resolver v1
#
# This manifest is the SEMANTIC definition for the identity-resolver
# processor, version 1. Per docs/architecture/05-processors-and-replay.md
# ("Processor Versioning"), the contents of this file for a given
# (name, version) pair are immutable. Any change that affects emitted
# event meaning, fields, identity links, attribution outcomes, filtering
# behavior, or output schema requires a NEW version directory (v2/) with
# its own manifest.
#
# PostgreSQL stores the runtime activation state (enabled/disabled,
# project/environment scope, consumer group, batch size, ...) — never
# semantic transformation rules. See docs/architecture/05-processors-and-replay.md
# "Processor Configuration".

name: identity-resolver
version: v1
owner: platform-identity
# P8-006: closed-set release lifecycle flag. `released` means this version
# is the production semantics; any output-changing fix is a new version
# (v2/) per docs/architecture/05-processors-and-replay.md "Processor
# Versioning". See docs/development/processor-manifests.md.
release_status: released
description: |
  Canonical identity-graph resolver. Consumes `raw.events` and:

  1. detects authoritative identity overlaps using the explicit-overlap rule
     from `docs/architecture/05-processors-and-replay.md` § "Identity
     Resolution" — a single event carrying two strong identifiers (e.g.
     `anonymous_id + customer_id`) is treated as an authoritative link.

  2. persists new authoritative links to the `identity_links` table with
     `confidence = authoritative` and `evidence_type = explicit_overlap`.

  3. emits governed events on `identity.events`:
       - `identity.linked`   first time a (left, right) pair is observed
       - `identity.merged`   pair causes two previously-separate canonical
                             identities to collapse onto one
       - `identity.rotated`  rotating identifier (anonymous_id) rolls under
                             a stable strong identifier (customer_id)

  v1 ONLY emits `confidence = authoritative` from the explicit-overlap rule.
  Heuristic rules (session proximity, device continuity, etc.) live in
  future processors and emit `confidence = candidate`; the canonical
  identity-resolver view filters on authoritative.

  The processor does NOT mutate the inbound canonical envelope. Events flow
  unchanged downstream — the resolver only WRITES new derived events on
  `identity.events` and rows on `identity_links`. Stamping `polaris_id` onto
  the canonical envelope would require an envelope-evolution change (the
  `identity` block is `.strict()`) and is intentionally out of scope for v1.

# Streaming mode: each input event maps to zero or more emitted identity.*
# events. v1 emits at most one identity.* event per input.
mode: streaming

# Topic-family inputs/outputs. The shared-kafka topic-family resolver
# turns these into concrete topic names per project isolation state at
# runtime. Per-project activation lives in PostgreSQL (P6-005).
inputs:
  - family: raw.events
    schema_versions: "*"   # the resolver does not gate on event schema version
outputs:
  - family: identity.events
    # The resolver only emits identity.{linked,merged,rotated} v1 envelopes.
    schema_versions: [1]

# State stores this processor uses.
#
# Note on storage layering: the durable canonical graph lives in
# PostgreSQL (`identity_links`). v1 reads/writes that table on every event
# carrying an authoritative overlap. A future Redis-backed lookup cache for
# hot reads is documented as a known gap in the processor's README.
state_stores:
  - postgres:identity_links

# Operational defaults the runtime helpers fall back to when no
# PostgreSQL activation row overrides them. Non-semantic per the
# architecture doc ("Processor Configuration").
defaults:
  consumer_group: polaris-identity-resolver-v1

# Replay metadata. Identity-resolver runs in replay mode by re-applying the
# explicit-overlap rule against the source raw.events range; idempotency is
# enforced by the partial unique index on
# (project_id, environment, left_identifier, right_identifier, evidence_type)
# WHERE superseded_at IS NULL.
replay:
  supported: true
  restrictions: []

# P8-006: free-form replay notes for operators. Machine-readable surface
# stays `replay.restrictions`; this block captures the prose so the runbook
# and the manifest stay aligned.
replay_notes: |
  Replays re-apply the explicit-overlap rule against the source raw.events
  range. Idempotency is enforced by the partial unique index on
  (project_id, environment, left_identifier, right_identifier,
  evidence_type) WHERE superseded_at IS NULL, so re-running the same slice
  emits no duplicate identity_links rows. The processor itself emits zero
  or one identity.* event per input — replaying a slice that initially
  produced identity.merged events will re-emit them in the same order; the
  canonical graph in PostgreSQL is the durable source of truth and the
  emitted events are best-effort observability for downstream consumers.

# P8-006: golden fixture pairs. The merge/link/rotate decision is purely a
# function of the source event's identity block, so each scenario maps a
# single input event to a single expected output event.
fixtures:
  - name: anonymous-to-customer-link
    input: test/golden/anonymous-to-customer-link.input.json
    output: test/golden/anonymous-to-customer-link.output.json
    description: |
      Canonical user.identified event carrying both anonymous_id and
      customer_id. The explicit-overlap rule yields one authoritative
      identity.linked event whose properties.left_identifier and
      properties.right_identifier capture the two strong identifiers, and
      properties.evidence_type is `explicit_overlap`.
