# Canonical consumer manifest for the webhook-sink v1 destination consumer.
#
# Mirrors the shape of {sync,async}/<stage>/<name>/<version>/processor.manifest.yaml. The
# manifest is the SEMANTIC config — what canonical events this consumer
# delivers, which vendor versions, which normalization profile. Runtime
# state (per-instance enable/disable, secret_value, max_rps, retry_policy)
# lives in the PostgreSQL `destinations` table managed by `polaris
# destinations` CLI commands. The manifest never carries runtime knobs.

name: webhook-sink
version: v1

vendor: webhook
vendor_api_version: n/a   # webhooks are vendor-agnostic; receivers vary
owner: platform-data

description: |
  Posts each canonical event as JSON to a configurable HTTPS endpoint,
  optionally signed with HMAC-SHA256. The first real consumer of the
  destination runtime; serves as the canonical exemplar future vendor
  consumers (Meta CAPI, GA4, TikTok, Braze) clone from.

inputs:
  # WE77L4R8: the spine's OUTPUT, not the legacy fan-out stream. This
  # consumer is the transparency exemplar, so it reads the family that
  # carries the profile and enrichment blocks the identity and enrichment
  # stages wrote — a receiver pointed here sees what a vendor mapper sees.
  #
  # Two families, for the same reason Braze reads two: the spine carries
  # what customers DID, the profile plane carries what is now TRUE of them
  # — audience membership and journey steps (UTHXL). An exemplar showing
  # only half of what a destination receives would be a poor exemplar.
  - resolved.events
  - profile.events

outputs:
  # Webhook sinks do not emit canonical Polaris events back into the
  # platform. Delivery is recorded in PostgreSQL `delivery_records` by
  # the destination runtime; that's not an emitted event topic.
  []

# State stores this consumer uses.
#
# Redis-backed, with an in-memory fallback when Redis is absent
# (libs/delivery/destinations/src/redis-bootstrap.ts). Declared anyway,
# and this is the point of declaring: the fallback is per-process, so a
# deployment running three replicas without Redis dedupes and rate-limits
# three times independently — correct-looking in one pod and wrong in
# aggregate. An operator reading this manifest should know Redis belongs
# in the deployment even though its absence does not crash anything.
state_stores:
  - redis:delivery_dedupe
  - redis:rate_limit
  - redis:circuit_breaker

mode: streaming

# Per-stage versions stamped onto every delivery_records row. A
# downstream consumer (audit dashboard, replay tooling) can scope to
# "all records produced with mapper/v1 against deliverer/v1" without
# bumping the whole consumer version.
# v2: the normalized event gained traits / traits_version / enrichment, and
# best_identity now leads with the platform's resolution. Bumped on every
# consumer, not only the flipped one, because the version stamps the
# normalize LOGIC and all six run the same code.
normalize_version: v2
mapper_version: v1
deliverer_version: v1

required_consent:
  # Webhook sinks are vendor-agnostic — the receiver decides whether
  # marketing/analytics consent is required. Polaris does not gate by
  # default; the per-destination instance can override via runtime knobs
  # if the operator wires a consent-aware receiver.
  marketing: false
  analytics: false
  personalization: false

identity_hashing:
  # Webhooks pass through both raw and hashed identity slots so the
  # receiver picks what it needs. Hash everything we can.
  email: true
  phone: true

dlq_topic_family: destination.webhook-sink.v1.dlq

defaults:
  request_timeout_ms: 5000
  retry_backoff_base_ms: 250
  retry_backoff_max_seconds: 300
  max_attempts: 8
