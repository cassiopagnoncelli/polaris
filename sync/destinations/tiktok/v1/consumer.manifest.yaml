# Canonical consumer manifest for the tiktok v1 destination consumer.
#
# Mirrors the shape of sync/destinations/meta-capi/v1/consumer.manifest.yaml.
# The manifest is the SEMANTIC config — what canonical events this
# consumer delivers, which vendor versions, which normalization profile.
# Runtime state (per-instance enable/disable, secret_value, max_rps,
# retry_policy) lives in the PostgreSQL `destinations` table managed by
# `polaris destinations` CLI commands. The manifest never carries runtime
# knobs.

name: tiktok
version: v1

vendor: tiktok
# TikTok Events API version this consumer targets. Pinned for the
# lifetime of v1; a future v2 may bump.
vendor_api_version: v1.3
owner: platform-data

description: |
  Posts canonical Polaris events into TikTok's Events API
  (business-api.tiktok.com/open_api/v1.3/event/track/) with hashed user
  identifiers, event_source inference, and TikTok cookie (ttp/ttclid)
  passthrough. Vendor dedupe keys on the canonical `event_id` so TikTok
  deduplicates cross-channel attempts.

inputs:
  # MVKUP64R: flipped to the spine's output.
  - resolved.events

outputs:
  # TikTok consumers do not emit Polaris events back into the
  # platform. Delivery is recorded in PostgreSQL `delivery_records` by
  # the destination runtime.
  []

mode: streaming

# Per-stage versions stamped onto every delivery_records row.
# v2 (WE77L4R8): shared normalize gained traits / enrichment and a
# profile-first identity preference. This consumer still reads
# analytics.events, where there is no profile block, so its OUTPUT is
# unchanged — but it runs the v2 code and must not claim otherwise.
normalize_version: v2
mapper_version: v1
deliverer_version: v1

required_consent:
  # TikTok Events API carries marketing payloads. Polaris gates on the
  # `marketing` consent dimension; analytics/personalization slots stay
  # at receiver-discretion.
  marketing: true
  analytics: false
  personalization: false

identity_hashing:
  # TikTok requires sha256(lowercased(trim(value))) for email and phone.
  # Mirrors Meta CAPI's contract — the shared normalize layer's email +
  # phone helpers produce the correct shape; this consumer enables both.
  email: true
  phone: true

dlq_topic_family: destination.tiktok.v1.dlq

defaults:
  # TikTok Events API rate limit profile: documented as bursts of up to
  # ~100 events/request and ~2000 events/minute/pixel; the production
  # destination row tunes per-instance max_rps below that.
  # Defaults below are per-attempt operational knobs the host may
  # override via env.
  request_timeout_ms: 5000
  retry_backoff_base_ms: 250
  retry_backoff_max_seconds: 300
  max_attempts: 8
