# Canonical consumer manifest for the meta-capi v1 destination consumer.
#
# Mirrors the shape of sync/destinations/webhook-sink/v1/consumer.manifest.yaml.
# The manifest is the SEMANTIC config — what canonical events this
# consumer delivers, which vendor versions, which normalization profile.
# Runtime state (per-instance enable/disable, secret_value, max_rps,
# retry_policy) lives in the PostgreSQL `destinations` table managed by
# `polaris destinations` CLI commands. The manifest never carries runtime
# knobs.

name: meta-capi
version: v1

vendor: meta-capi
# Meta CAPI graph version this consumer targets. Pinned for the lifetime
# of v1; a future v2 may bump.
vendor_api_version: v22.0
owner: platform-data

description: |
  Posts canonical Polaris events into Meta's Conversions API
  (graph.facebook.com/v22.0/<pixel_id>/events) with hashed user identifiers,
  action_source inference, and fbp/fbc cookie passthrough. Vendor dedupe
  keys on the canonical `event_id` so Meta deduplicates cross-channel
  attempts.

inputs:
  - analytics.events

outputs:
  # Meta CAPI consumers do not emit Polaris events back into the
  # platform. Delivery is recorded in PostgreSQL `delivery_records` by
  # the destination runtime.
  []

mode: streaming

# Per-stage versions stamped onto every delivery_records row.
normalize_version: v1
mapper_version: v1
deliverer_version: v1

required_consent:
  # Meta CAPI carries marketing payloads. Polaris gates on the
  # `marketing` consent dimension; analytics/personalization slots stay
  # at receiver-discretion (Meta's own ad-personalization toggle is a
  # separate signal carried via `data_processing_options`).
  marketing: true
  analytics: false
  personalization: false

identity_hashing:
  # Meta requires sha256(lowercased(trim(value))) for em / ph / external_id.
  # The shared normalize layer's email + phone helpers already produce
  # the correct shape; this consumer enables both.
  email: true
  phone: true

dlq_topic_family: destination.meta-capi.v1.dlq

defaults:
  # Meta CAPI's published rate limit is ~1000 events/sec/account; the
  # production destination row tunes per-instance max_rps below that.
  # Defaults below are per-attempt operational knobs the host may
  # override via env.
  request_timeout_ms: 5000
  retry_backoff_base_ms: 250
  retry_backoff_max_seconds: 300
  max_attempts: 8
