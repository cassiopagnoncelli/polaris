# Polaris local core data-path stack.
#
# This compose file is intentionally lean. It runs only the four services that
# sit on the canonical event path:
#
#   - RabbitMQ     event transport backbone (single node, streams + quorum)
#   - PostgreSQL   mutable runtime/control state
#   - Redis        short-lived dedupe, rate-limit, processor cache
#   - ClickHouse   analytical storage (single node, no Keeper)
#
# Optional observability and destination mocks live in separate compose files
# under future tasks (P10-001 observability compose, etc.). They are not part
# of this file by design.
#
# See:
#   docs/architecture/08-observability-and-operations.md  (local stack contract)
#   docs/architecture/03-rabbitmq-streams.md              (broker/stream defaults)
#   docs/architecture/07-clickhouse.md                    (engine families)
#   docs/architecture/11-production-readiness.md          (local vs production)
#
# Conventions:
#   - Host ports default to upstream defaults so local tools just work.
#   - Override host ports with the *_HOST_PORT env vars below if they clash.
#   - All persistent state lives in named volumes so `docker compose down`
#     keeps data and `docker compose down -v` wipes it.

name: polaris

services:
  rabbitmq:
    # Single-node RabbitMQ for local/dev: streams with replication factor 1
    # and quorum queues that degrade to a single replica. Production runs a
    # 3-node cluster (RF=3) and lives in its own deployment, not this
    # compose.
    #
    # The image is the `-management` variant so `rabbitmqctl`, the HTTP API,
    # and the management UI are all available without a second container.
    # `rabbitmq_stream` and `rabbitmq_prometheus` are enabled below.
    image: rabbitmq:4.1-management
    container_name: polaris-rabbitmq
    restart: unless-stopped
    hostname: polaris-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-polaris}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-polaris}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      # A stable node name keeps the mnesia/khepri directory stable across
      # container recreation, so streams survive `docker compose up -d`.
      RABBITMQ_NODENAME: rabbit@polaris-rabbitmq
    ports:
      # AMQP 0-9-1 — every Polaris service connects here.
      - "${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      # Management UI + HTTP API — provisioning and operator tooling.
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
      # Native stream protocol — not used by v1 services (see the protocol
      # decision in docs/implementation/rabbitmq-redesign-plan.md), exposed
      # so `rabbitmq-streams` tooling and a future native client work
      # without recreating the container.
      - "${RABBITMQ_STREAM_HOST_PORT:-5552}:5552"
      # Prometheus scrape endpoint.
      - "${RABBITMQ_PROMETHEUS_HOST_PORT:-15692}:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-polaris.conf:ro
    healthcheck:
      # `check_running` alone returns healthy before the stream plugin is
      # ready; `check_port_connectivity` covers the listeners Polaris needs.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - polaris

  postgres:
    # Local PostgreSQL for runtime/control state (api_keys, sources,
    # destination instances, processor runs, replay jobs, delivery records,
    # audit records). Schema is owned by P1-002 migrations.
    image: postgres:16.6-alpine
    container_name: polaris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris}
      POSTGRES_DB: ${POSTGRES_DB:-polaris}
      # Stable UTC default so `now()` matches the rest of the platform.
      PGTZ: UTC
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - polaris

  redis:
    # Local Redis for short-lived state only: 15-minute ingest dedupe,
    # rate-limit counters, processor ephemeral caches. No persistence is
    # required — losing Redis is acceptable, the platform tolerates it.
    image: redis:7.4-alpine
    container_name: polaris-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - polaris

  clickhouse:
    # Single-node ClickHouse for local/dev — plain MergeTree / ReplacingMergeTree.
    # Macros in infra/clickhouse/config.d/macros.xml expand the {replicated},
    # {cluster}, {shard}, {replica} placeholders to local-safe values so the
    # same SQL DDL that runs in production (Replicated* engines + Keeper)
    # works here unchanged.
    #
    # Pinned to 26.2 so docker and bare-metal local installs run the same
    # major. ClickHouse 25+ requires `<zookeeper>` + `<distributed_ddl>` for
    # any `ON CLUSTER` DDL (the polaris SQL uses it everywhere), so this
    # service mounts infra/clickhouse/config.d/keeper-local.xml — a tiny
    # single-node embedded Keeper that satisfies the requirement without
    # introducing a separate Keeper container.
    image: clickhouse/clickhouse-server:26.2
    container_name: polaris-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-polaris}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-polaris}
      # Required to let the polaris user run grants/role DDL when P1-003
      # applies the roles SQL. Local-only convenience.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # HTTP interface — used by `@clickhouse/client` over HTTP, the
      # ClickHouse Play UI, and `clickhouse-client --port 8123`.
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      # Native TCP interface — `clickhouse-client` default, faster bulk loads.
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      # Selective read-only overlays. Mounting individual files (not the whole
      # config.d/ directory) keeps production-only configs (macros-production.xml,
      # keeper.xml) out of the local container even though they share the same
      # source directory on disk. ClickHouse loads every *.xml in its config.d/,
      # so directory-level mounting would pick up the production macros and
      # break local engine selection.
      - ./infra/clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./infra/clickhouse/config.d/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./infra/clickhouse/config.d/keeper-local.xml:/etc/clickhouse-server/config.d/keeper-local.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - polaris

  minio:
    # S3-compatible object storage for the raw.events archive.
    #
    # The archive is where events go once the stream's retention window
    # closes over them, and it is what lets `polaris profiles rebuild`
    # reach further back than ninety days. Locally that is MinIO; in
    # production it is S3, and the only difference is two env vars —
    # POLARIS_ARCHIVE_S3_ENDPOINT and POLARIS_ARCHIVE_S3_FORCE_PATH_STYLE,
    # because MinIO addresses buckets by path rather than by subdomain.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: polaris-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Local-only credentials. Production uses the SDK's own credential
      # chain (instance role, web identity) and sets no static keys.
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-polaris}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-polaris-local-dev}"
    ports:
      # 9002/9003, NOT MinIO's usual 9000/9001: ClickHouse's native port
      # is 9000 and is published by the `clickhouse` service in this same
      # file. Docker only reports that collision when both are up, and the
      # symptom otherwise is an S3 client getting ClickHouse's "Port 9000
      # is for clickhouse-client program" back as an XML parse error.
      # Inside the network MinIO still answers on 9000; only the host
      # mapping moves.
      - "${MINIO_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - polaris

  minio-bucket:
    # Creates the archive bucket once and exits. A bucket that has to be
    # created by hand is a bucket the archiver crash-loops against on a
    # fresh checkout, and the error it prints is about credentials rather
    # than about the missing bucket.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: polaris-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"${MINIO_ROOT_USER:-polaris}\" \"${MINIO_ROOT_PASSWORD:-polaris-local-dev}\" &&
      mc mb --ignore-existing local/${POLARIS_ARCHIVE_BUCKET:-polaris-archive} &&
      echo 'archive bucket ready'
      "
    networks:
      - polaris

volumes:
  rabbitmq-data:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:

networks:
  polaris:
    name: polaris
    driver: bridge
