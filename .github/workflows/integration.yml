# Polaris Integration CI — Docker-backed checks against real services.
#
# Per docs/architecture/09-engineering-standards.md "CI Quality Gates",
# integration checks against PostgreSQL, Redis, Redpanda, and ClickHouse
# (plus the vertical-slice smoke test) run scheduled, manually, or on PRs
# that opt in via the `integration` label — not on every PR — until the
# test suite stabilises.
#
# v1 of the integration suite runs the P5-001 vertical-slice smoke against
# the same `docker-compose.yml` developers use locally. Using compose
# (rather than GitHub's `services:` containers) keeps the network shape
# identical between CI and local: ClickHouse's Kafka Engine table is
# wired to `redpanda:9092` inside the compose `polaris` bridge network,
# and that resolution path only exists when every service shares that
# network. P9-* destination consumer tests will plug into this same
# compose-backed setup.

name: Integration

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC every day — early enough that failures land before
    # the engineering day starts in the host timezone.
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.30.0"

jobs:
  vertical-slice-smoke:
    name: P5-001 vertical-slice smoke
    runs-on: ubuntu-latest
    # Skip the heavy services unless the PR was explicitly labelled
    # `integration`, or the workflow was triggered manually / on a schedule.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    timeout-minutes: 30
    env:
      # Same env vars the smoke runner reads (see
      # scripts/smoke/vertical-slice.mjs). The host ports default to the
      # compose defaults; the smoke runner reaches each service on
      # localhost because the compose `ports:` declarations expose them.
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: polaris
      CLICKHOUSE_PASSWORD: polaris
      POLARIS_INGESTER_URL: http://localhost:8080
      POLARIS_SMOKE_PROJECT_ID: storefront
      POLARIS_SMOKE_ENVIRONMENT: development
      POLARIS_SMOKE_SOURCE_ID: payments-api
      POLARIS_SMOKE_SOURCE_TYPE: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc emit)
        run: pnpm build

      # Bring up Redpanda + PostgreSQL + Redis + ClickHouse in the same
      # compose network the local-dev stack uses. The smoke runner then
      # reaches each service through the published host ports.
      - name: Start local stack
        run: docker compose up -d --wait

      - name: Apply PostgreSQL migrations
        run: pnpm db:migrate

      - name: Apply ClickHouse schema (incl. local users)
        run: pnpm clickhouse:bootstrap-local

      # The ingester + analytics-projector are workspace services. We run
      # them in the background and capture pid + logs so a smoke failure
      # has the upstream logs immediately available.
      - name: Start ingester
        run: |
          mkdir -p /tmp/polaris-logs
          pnpm --filter @polaris/ingester-api run start \
            > /tmp/polaris-logs/ingester.log 2>&1 &
          echo $! > /tmp/polaris-logs/ingester.pid
        env:
          POLARIS_SERVICE_NAME: polaris-ingester
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "8080"
          POLARIS_REDPANDA_BROKERS: localhost:19092
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_REDIS_HOST: localhost
          POLARIS_REDIS_PORT: "6379"

      - name: Start analytics-projector
        run: |
          pnpm --filter @polaris/processor-analytics-projector-v1 run start \
            > /tmp/polaris-logs/analytics-projector.log 2>&1 &
          echo $! > /tmp/polaris-logs/analytics-projector.pid
        env:
          POLARIS_SERVICE_NAME: polaris-analytics-projector
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "8081"
          POLARIS_REDPANDA_BROKERS: localhost:19092

      # Wait for the ingester to expose /ready before running the smoke.
      - name: Wait for ingester readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ready >/dev/null; then
              echo "ingester ready"; exit 0
            fi
            sleep 2
          done
          echo "ingester did not become ready"
          exit 1

      - name: Run vertical-slice smoke (P5-001)
        run: pnpm smoke:vertical-slice

      - name: Run smoke as a vitest job
        # Reruns the runner under vitest so the test reporter produces a
        # standard pass/fail line. Useful for matrix dashboards.
        run: pnpm test:smoke

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps || true
          echo "=== ingester ==="
          tail -n 200 /tmp/polaris-logs/ingester.log || true
          echo "=== analytics-projector ==="
          tail -n 200 /tmp/polaris-logs/analytics-projector.log || true
          echo "=== docker compose logs (last 200 lines) ==="
          docker compose logs --tail=200 || true

      - name: Tear down local stack
        if: always()
        run: |
          if [ -f /tmp/polaris-logs/ingester.pid ]; then
            kill "$(cat /tmp/polaris-logs/ingester.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/analytics-projector.pid ]; then
            kill "$(cat /tmp/polaris-logs/analytics-projector.pid)" 2>/dev/null || true
          fi
          docker compose down -v || true
