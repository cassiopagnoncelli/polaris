# Polaris Integration CI — Docker-backed checks against real services.
#
# Per docs/architecture/09-engineering-standards.md "CI Quality Gates",
# integration checks against PostgreSQL, Redis, RabbitMQ, and ClickHouse
# (plus the vertical-slice smoke test) run scheduled, manually, or on PRs
# that opt in via the `integration` label — not on every PR — until the
# test suite stabilises.
#
# v1 of the integration suite runs the P5-001 vertical-slice smoke against
# the same `docker-compose.yml` developers use locally. Using compose
# (rather than GitHub's `services:` containers) keeps the network shape
# identical between CI and local. P9-* destination consumer tests plug
# into this same compose-backed setup.
#
# RabbitMQ auto-creates nothing, so `pnpm rabbitmq:provision` is a hard
# prerequisite here, not a convenience: without it every publish comes
# back unroutable and the smoke fails with a confusing error rather than
# a missing-topology one.

name: Integration

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC every day — early enough that failures land before
    # the engineering day starts in the host timezone.
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # pnpm's version is NOT pinned here. `pnpm/action-setup` refuses to run when
  # its `version` input and the root package.json's `packageManager` field both
  # name a version and they disagree -- it fails at the install step, before
  # any gate runs, so every job reports a failure that says nothing about the
  # code.
  #
  # That is exactly what happened. `a61bf2f` (2026-08-12) bumped
  # `packageManager` from pnpm@10.30.0 to pnpm@11.21.0 and left the workflow's
  # copy behind. CI failed on every push for the next seven days -- 60 runs,
  # not one green -- so typecheck, lint, format and the entire test suite went
  # unenforced while commit after commit claimed them.
  #
  # Deleting the pin rather than syncing it: two places holding one version is
  # what broke, and syncing them only resets the clock until the next bump.
  # `packageManager` is the copy the repository already has to keep correct,
  # because corepack and every local `pnpm` invocation read it.

jobs:
  vertical-slice-smoke:
    name: P5-001 vertical-slice smoke
    runs-on: ubuntu-latest
    # Skip the heavy services unless the PR was explicitly labelled
    # `integration`, or the workflow was triggered manually / on a schedule.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    timeout-minutes: 30
    env:
      # Same env vars the smoke runner reads (see
      # scripts/smoke/vertical-slice.mjs). The host ports default to the
      # compose defaults; the smoke runner reaches each service on
      # localhost because the compose `ports:` declarations expose them.
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: polaris
      CLICKHOUSE_PASSWORD: polaris
      POLARIS_INGESTER_URL: http://localhost:4000
      POLARIS_SMOKE_PROJECT_ID: storefront
      POLARIS_SMOKE_ENVIRONMENT: development
      POLARIS_SMOKE_SOURCE_ID: payments-api
      POLARIS_SMOKE_SOURCE_TYPE: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc emit)
        run: pnpm build

      # Bring up RabbitMQ + PostgreSQL + Redis + ClickHouse in the same
      # compose network the local-dev stack uses. The smoke runner then
      # reaches each service through the published host ports.
      - name: Start local stack
        run: docker compose up -d --wait

      # One command, the same one a developer runs — RabbitMQ topology,
      # PostgreSQL migrations, ClickHouse schema, catalog seeds, API keys.
      # CI running the real bootstrap rather than its own copy of the recipe
      # is the point: an unexercised bootstrap script is one that rots.
      #
      # Its destroy phase is very nearly a no-op against these fresh
      # containers, which is itself worth having — it proves destroy is safe
      # on empty stores, the case a re-run after a mid-install crash hits.
      - name: Install Polaris (bin/setup)
        run: ./bin/setup

      # The ingester and both spine stages are workspace services. We run
      # them in the background and capture pid + logs so a smoke failure
      # has the upstream logs immediately available.
      - name: Start ingester
        run: |
          mkdir -p /tmp/polaris-logs
          pnpm --filter @polaris/ingester-api run start \
            > /tmp/polaris-logs/ingester.log 2>&1 &
          echo $! > /tmp/polaris-logs/ingester.pid
        env:
          POLARIS_SERVICE_NAME: polaris-ingester
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4000"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_REDIS_HOST: localhost
          POLARIS_REDIS_PORT: "6379"

      - name: Start sync-identity
        run: |
          pnpm --filter @polaris/sync-identity-resolver-v1 run start \
            > /tmp/polaris-logs/sync-identity.log 2>&1 &
          echo $! > /tmp/polaris-logs/sync-identity.pid
        env:
          POLARIS_SERVICE_NAME: polaris-sync-identity
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4018"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          # Stream consumers own their resume point in PostgreSQL: AMQP
          # has no server-side offset store.
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_SYNC_IDENTITY_CATALOG_ROOT: ${{ github.workspace }}

      - name: Start sync-enrichment
        run: |
          pnpm --filter @polaris/sync-enrichment-runtime-v1 run start \
            > /tmp/polaris-logs/sync-enrichment.log 2>&1 &
          echo $! > /tmp/polaris-logs/sync-enrichment.pid
        env:
          POLARIS_SERVICE_NAME: polaris-sync-enrichment
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4015"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          # Stream consumers own their resume point in PostgreSQL: AMQP
          # has no server-side offset store.
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_SYNC_ENRICHMENT_CATALOG_ROOT: ${{ github.workspace }}


      # The ClickHouse sink is what carries resolved.events into
      # ClickHouse. It replaced the Kafka Engine table, which used to make
      # this hop invisible in CI — without this service the smoke's
      # analytics_raw poll never sees a row.
      - name: Start clickhouse-sink
        run: |
          pnpm --filter @polaris/consumer-clickhouse-sink-v1 run start \
            > /tmp/polaris-logs/clickhouse-sink.log 2>&1 &
          echo $! > /tmp/polaris-logs/clickhouse-sink.pid
        env:
          POLARIS_SERVICE_NAME: polaris-clickhouse-sink
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "5010"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_CLICKHOUSE_URL: http://localhost:8123
          POLARIS_CLICKHOUSE_DATABASE: polaris
          POLARIS_CLICKHOUSE_SERVICE_USER: polaris_service
          POLARIS_CLICKHOUSE_SERVICE_PASSWORD: polaris_service
          POLARIS_CLICKHOUSE_SINK_USER: polaris_sink
          POLARIS_CLICKHOUSE_SINK_PASSWORD: polaris_sink
          # Keep CI latency low: flush small batches quickly so the smoke
          # poll does not wait on the default batching window.
          POLARIS_CLICKHOUSE_SINK_BATCH_MAX_ROWS: "1"
          POLARIS_CLICKHOUSE_SINK_BATCH_MAX_MS: "250"

      # Wait for the ingester to expose /ready before running the smoke.
      - name: Wait for ingester readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/ready >/dev/null; then
              echo "ingester ready"; exit 0
            fi
            sleep 2
          done
          echo "ingester did not become ready"
          exit 1


      # Driver behaviour the unit fakes cannot express: prefetch pushing
      # messages ahead of the handler, basic.return arriving out of band
      # from a confirm, a quorum queue's TTL actually firing, a stream
      # attaching at a timestamp, and the Postgres checkpoint store's SQL.
      # Every defect this covers was found live AFTER the unit suite was
      # green.

      # The service half of the meta-gate: break what each service-dependent
      # check is supposed to notice, run it, require a non-zero exit. The
      # default `verify:gates` roster is service-free by design and runs in
      # static analysis; this is the part that needs the compose stack.
      - name: Prove every service-dependent gate can fail
        env:
          POLARIS_CLICKHOUSE_URL: http://localhost:8123
        run: pnpm verify:gates:services

      # The only check that reads the REAL ClickHouse schema. `lint-trait-sql`
      # checks which tables a definition names; it cannot check whether the
      # COLUMNS exist, and that gap shipped three broken definitions.
      #
      # `--require-clickhouse` so a compose failure cannot turn this into a
      # silent pass: without the flag the script exits 0 when no server
      # answers, which is right on a laptop and useless as a gate.
      - name: Catalog SQL resolves against the real schema
        env:
          # Named explicitly rather than leaning on the script's default
          # happening to match the compose port. The job's other ClickHouse
          # vars are unprefixed (`CLICKHOUSE_URL`), which this script does
          # not read.
          POLARIS_CLICKHOUSE_URL: http://localhost:8123
        run: pnpm check:catalog-sql:ci

      - name: Run broker + database integration tests
        run: pnpm test:integration
        env:
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris

      - name: Run vertical-slice smoke (P5-001)
        run: pnpm smoke:vertical-slice

      - name: Run smoke as a vitest job
        # Reruns the runner under vitest so the test reporter produces a
        # standard pass/fail line. Useful for matrix dashboards.
        run: pnpm test:smoke

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps || true
          echo "=== ingester ==="
          tail -n 200 /tmp/polaris-logs/ingester.log || true
          echo "=== sync-identity ==="
          tail -n 200 /tmp/polaris-logs/sync-identity.log || true
          echo "=== sync-enrichment ==="
          tail -n 200 /tmp/polaris-logs/sync-enrichment.log || true
          echo "=== clickhouse-sink ==="
          tail -n 200 /tmp/polaris-logs/clickhouse-sink.log || true
          echo "=== docker compose logs (last 200 lines) ==="
          docker compose logs --tail=200 || true

      - name: Tear down local stack
        if: always()
        run: |
          if [ -f /tmp/polaris-logs/ingester.pid ]; then
            kill "$(cat /tmp/polaris-logs/ingester.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/sync-identity.pid ]; then
            kill "$(cat /tmp/polaris-logs/sync-identity.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/sync-enrichment.pid ]; then
            kill "$(cat /tmp/polaris-logs/sync-enrichment.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/clickhouse-sink.pid ]; then
            kill "$(cat /tmp/polaris-logs/clickhouse-sink.pid)" 2>/dev/null || true
          fi
          docker compose down -v || true

  product-acceptance:
    # P12-003 product acceptance — the canonical release gate. Drives the
    # full pipeline end-to-end through the published CLI + Node SDK
    # surfaces against a freshly-booted compose stack. Mirrors the smoke
    # job's setup; the only differences are the final test command and
    # the POLARIS_ACCEPTANCE_* env vars.
    name: P12-003 product acceptance
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: polaris
      CLICKHOUSE_PASSWORD: polaris
      POLARIS_INGESTER_URL: http://localhost:4000
      POLARIS_ACCEPTANCE_PROJECT_ID: storefront
      POLARIS_ACCEPTANCE_ENVIRONMENT: development
      POLARIS_ACCEPTANCE_SOURCE_ID: payments-api
      POLARIS_ACCEPTANCE_SOURCE_TYPE: backend
      # No webhook receiver in CI — the destination + delivery steps skip
      # cleanly (overall verdict still PASS). Set POLARIS_ACCEPTANCE_WEBHOOK_URL
      # in a future card when we wire a sandbox receiver.
      POLARIS_ACCEPTANCE_SKIP_DESTINATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc emit)
        run: pnpm build

      - name: Start local stack
        run: docker compose up -d --wait

      # See the acceptance job above for why this is `bin/setup` and not a
      # hand-rolled sequence.
      - name: Install Polaris (bin/setup)
        run: ./bin/setup

      - name: Start ingester
        run: |
          mkdir -p /tmp/polaris-logs
          pnpm --filter @polaris/ingester-api run start \
            > /tmp/polaris-logs/ingester.log 2>&1 &
          echo $! > /tmp/polaris-logs/ingester.pid
        env:
          POLARIS_SERVICE_NAME: polaris-ingester
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4000"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_REDIS_HOST: localhost
          POLARIS_REDIS_PORT: "6379"

      - name: Start sync-identity
        run: |
          pnpm --filter @polaris/sync-identity-resolver-v1 run start \
            > /tmp/polaris-logs/sync-identity.log 2>&1 &
          echo $! > /tmp/polaris-logs/sync-identity.pid
        env:
          POLARIS_SERVICE_NAME: polaris-sync-identity
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4018"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          # Stream consumers own their resume point in PostgreSQL: AMQP
          # has no server-side offset store.
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_SYNC_IDENTITY_CATALOG_ROOT: ${{ github.workspace }}

      - name: Start sync-enrichment
        run: |
          pnpm --filter @polaris/sync-enrichment-runtime-v1 run start \
            > /tmp/polaris-logs/sync-enrichment.log 2>&1 &
          echo $! > /tmp/polaris-logs/sync-enrichment.pid
        env:
          POLARIS_SERVICE_NAME: polaris-sync-enrichment
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "4015"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          # Stream consumers own their resume point in PostgreSQL: AMQP
          # has no server-side offset store.
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_SYNC_ENRICHMENT_CATALOG_ROOT: ${{ github.workspace }}


      # The ClickHouse sink carries analytics.events into ClickHouse.
      - name: Start clickhouse-sink
        run: |
          pnpm --filter @polaris/consumer-clickhouse-sink-v1 run start \
            > /tmp/polaris-logs/clickhouse-sink.log 2>&1 &
          echo $! > /tmp/polaris-logs/clickhouse-sink.pid
        env:
          POLARIS_SERVICE_NAME: polaris-clickhouse-sink
          POLARIS_SERVICE_VERSION: "0.0.0-ci"
          POLARIS_ENVIRONMENT: development
          POLARIS_HTTP_HOST: 0.0.0.0
          POLARIS_HTTP_PORT: "5010"
          POLARIS_RABBITMQ_URL: amqp://polaris:polaris@localhost:5672
          POLARIS_RABBITMQ_CLIENT_ID: polaris-ci
          POLARIS_POSTGRES_HOST: localhost
          POLARIS_POSTGRES_PORT: "5432"
          POLARIS_POSTGRES_DATABASE: polaris
          POLARIS_POSTGRES_USER: polaris
          POLARIS_POSTGRES_PASSWORD: polaris
          POLARIS_CLICKHOUSE_URL: http://localhost:8123
          POLARIS_CLICKHOUSE_DATABASE: polaris
          POLARIS_CLICKHOUSE_SERVICE_USER: polaris_service
          POLARIS_CLICKHOUSE_SERVICE_PASSWORD: polaris_service
          POLARIS_CLICKHOUSE_SINK_USER: polaris_sink
          POLARIS_CLICKHOUSE_SINK_PASSWORD: polaris_sink
          POLARIS_CLICKHOUSE_SINK_BATCH_MAX_ROWS: "1"
          POLARIS_CLICKHOUSE_SINK_BATCH_MAX_MS: "250"

      - name: Wait for ingester readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/ready >/dev/null; then
              echo "ingester ready"; exit 0
            fi
            sleep 2
          done
          echo "ingester did not become ready"
          exit 1

      - name: Run product acceptance (P12-003)
        run: pnpm test:acceptance

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps || true
          echo "=== ingester ==="
          tail -n 200 /tmp/polaris-logs/ingester.log || true
          echo "=== sync-identity ==="
          tail -n 200 /tmp/polaris-logs/sync-identity.log || true
          echo "=== sync-enrichment ==="
          tail -n 200 /tmp/polaris-logs/sync-enrichment.log || true
          echo "=== clickhouse-sink ==="
          tail -n 200 /tmp/polaris-logs/clickhouse-sink.log || true
          echo "=== docker compose logs (last 200 lines) ==="
          docker compose logs --tail=200 || true

      - name: Tear down local stack
        if: always()
        run: |
          if [ -f /tmp/polaris-logs/ingester.pid ]; then
            kill "$(cat /tmp/polaris-logs/ingester.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/sync-identity.pid ]; then
            kill "$(cat /tmp/polaris-logs/sync-identity.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/sync-enrichment.pid ]; then
            kill "$(cat /tmp/polaris-logs/sync-enrichment.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/polaris-logs/clickhouse-sink.pid ]; then
            kill "$(cat /tmp/polaris-logs/clickhouse-sink.pid)" 2>/dev/null || true
          fi
          docker compose down -v || true
