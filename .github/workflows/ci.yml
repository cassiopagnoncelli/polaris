# Polaris CI — pull-request and push gates.
#
# Runs the quality gates documented in docs/architecture/09-engineering-standards.md
# ("CI Quality Gates") plus the ClickHouse import-restriction check from
# docs/architecture/07-clickhouse.md ("Access Control") and the raw-NUL-byte
# check (see docs/development/ci.md).
#
# Docker-backed integration checks (Postgres, Redis, RabbitMQ, ClickHouse,
# vertical-slice smoke test) live in `integration.yml` and run on a schedule,
# manual dispatch, or the `integration` PR label. See `docs/development/ci.md`.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual reruns from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-flight runs on the same PR / branch when a new commit lands.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin a single Node major across all jobs. >= 22 is the Active LTS pinned
  # in the root package.json `engines` field.
  NODE_VERSION: "22"
  # Pin pnpm to match `packageManager` in the root package.json.
  PNPM_VERSION: "10.30.0"

jobs:
  static-analysis:
    name: Static analysis (typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Many per-package typecheck runs depend on dist/ from their dependencies.
      # `pnpm build` is cheap (tsc only) and matches the production build path.
      - name: Build (tsc emit)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome + ClickHouse import-restriction + raw-NUL check)
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm format:check

  test:
    name: Tests (unit + contract + catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same rationale as the static-analysis job: workspace tests rely on
      # each package's compiled dist/.
      - name: Build (tsc emit)
        run: pnpm build

      # Covers unit tests, contract/schema tests, the event-catalog validation
      # suite in @polaris/shared-schemas, plus the repo-root scripts tests
      # (lint-clickhouse-imports). See package.json `test` script.
      - name: Test (workspace + scripts)
        run: pnpm test

  migrations:
    name: PostgreSQL migration smoke (dbmate up)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Matches `docker-compose.yml` defaults; overridden in production.
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dbmate has no dry-run mode. We validate by applying every migration
      # against a disposable Postgres service. The shared-db package owns the
      # dbmate binary; running `pnpm db:migrate` from the repo root applies
      # files in `db/migrations/`.
      - name: Apply migrations (db:migrate)
        run: pnpm db:migrate

      - name: Show migration status
        run: pnpm db:status
