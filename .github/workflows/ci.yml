# Polaris CI — pull-request and push gates.
#
# Runs the quality gates documented in docs/architecture/09-engineering-standards.md
# ("CI Quality Gates") plus the ClickHouse import-restriction check from
# docs/architecture/07-clickhouse.md ("Access Control") and the raw-NUL-byte
# check (see docs/development/ci.md).
#
# Docker-backed integration checks (Postgres, Redis, RabbitMQ, ClickHouse,
# vertical-slice smoke test) live in `integration.yml` and run on a schedule,
# manual dispatch, or the `integration` PR label. See `docs/development/ci.md`.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual reruns from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-flight runs on the same PR / branch when a new commit lands.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin a single Node major across all jobs. >= 22 is the Active LTS pinned
  # in the root package.json `engines` field.
  NODE_VERSION: "22"
  # pnpm's version is NOT pinned here. `pnpm/action-setup` refuses to run when
  # its `version` input and the root package.json's `packageManager` field both
  # name a version and they disagree -- it fails at the install step, before
  # any gate runs, so every job reports a failure that says nothing about the
  # code.
  #
  # That is exactly what happened. `a61bf2f` (2026-08-12) bumped
  # `packageManager` from pnpm@10.30.0 to pnpm@11.21.0 and left the workflow's
  # copy behind. CI failed on every push for the next seven days -- 60 runs,
  # not one green -- so typecheck, lint, format and the entire test suite went
  # unenforced while commit after commit claimed them.
  #
  # Deleting the pin rather than syncing it: two places holding one version is
  # what broke, and syncing them only resets the clock until the next bump.
  # `packageManager` is the copy the repository already has to keep correct,
  # because corepack and every local `pnpm` invocation read it.

jobs:
  static-analysis:
    name: Static analysis (typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: `config-schemas:check` compares each generated artifact
      # against its version in git HEAD to enforce additive-only changes, and
      # a shallow clone makes that comparison silently vacuous.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Many per-package typecheck runs depend on dist/ from their dependencies.
      # `pnpm build` is cheap (tsc only) and matches the production build path.
      - name: Build (tsc emit)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome + ClickHouse import-restriction + raw-NUL check)
        run: pnpm lint

      - name: Format check (Biome)
        run: pnpm format:check

      # Two checks that existed and no workflow ran -- found while auditing why
      # CI had been failing for a week. A gate nobody runs is a gate that does
      # not exist, which is the same shape as the pnpm version that broke this
      # workflow in the first place.
      #
      # `check:catalog-sql` is deliberately NOT here. It needs a reachable
      # ClickHouse and exits 0 with "skipped" when there is none, so a step
      # here would always pass -- a green tick for a check that ran nothing.
      # It belongs in `integration.yml`, where the compose stack is up.
      - name: OpenAPI document in sync with the code
        run: pnpm openapi:check

      # Also enforces the rule the generator states: a breaking config change
      # must fail its own PR, not a rolling deploy. That half compares each
      # artifact against its version in git HEAD, which is why this job now
      # checks out full history.
      - name: Project-config schemas in sync, and additive-only
        run: pnpm config-schemas:check

      # The meta-gate: break something each check is supposed to notice, run
      # it, require a non-zero exit, restore. "A check nobody has watched fail
      # is a check nobody knows works" -- and three of the checks in this
      # repository once passed on the exact bug they were written for.
      #
      # It ran nowhere until now, which made it the same kind of artifact as
      # the checks it is meant to police. Six seconds for thirteen gates.
      #
      # It refuses on a dirty tree because it restores with `git checkout`.
      # That holds here: `--frozen-lockfile` cannot rewrite the lockfile and
      # every build output is gitignored.
      - name: Prove every gate can fail
        run: pnpm verify:gates

  test:
    name: Tests (unit + contract + catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same rationale as the static-analysis job: workspace tests rely on
      # each package's compiled dist/.
      - name: Build (tsc emit)
        run: pnpm build

      # Covers unit tests, contract/schema tests, the event-catalog validation
      # suite in @polaris/shared-schemas, plus the repo-root scripts tests
      # (lint-clickhouse-imports). See package.json `test` script.
      - name: Test (workspace + scripts)
        run: pnpm test

  migrations:
    name: PostgreSQL migration smoke (dbmate up)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Matches `docker-compose.yml` defaults; overridden in production.
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dbmate has no dry-run mode. We validate by applying every migration
      # against a disposable Postgres service. The shared-db package owns the
      # dbmate binary; running `pnpm db:migrate` from the repo root applies
      # files in `db/migrations/`.
      - name: Apply migrations (db:migrate)
        run: pnpm db:migrate

      - name: Show migration status
        run: pnpm db:status
