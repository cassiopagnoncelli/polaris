# Catalog entry: audience.exited v1 (ACTIVE)
#
# The mirror of `audience.entered`, and not an afterthought.
#
# Suppression is the usual reason an audience exists — "stop showing ads to
# people who already bought" — and that use is entirely the exit half. A
# vendor audience fed only additions grows to describe everyone who ever
# qualified, and is wrong in the direction that spends money.
#
# `entered_at` carries the start of the membership this exit closes, so a
# consumer can compute dwell time without keeping its own ledger.
#
# Note that an exit also fires when a trait the predicate reads goes
# ABSENT. Per definitions/traits, absent means "not computed", not zero, so a
# trait that fails to compute empties every audience built on it. That is
# intended: an audience whose input is unknown has no defensible
# membership, and holding the previous population would keep vendors
# acting on a belief the platform no longer holds.
name: audience.exited
schema_version: 1
domain: audience
owner: platform-data
description: >-
  Records that a profile left an audience, naming the definition version
  that evaluated the transition and when the closed membership began.
lifecycle: active
since: "2026-08-16"
schema_module: "@polaris/spec/events/audience/exited.v1"
schema_export: audienceExitedV1PropertiesSchema
